<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VM Hello</title>
<style>body{font:17px system-ui;background:#101820;color:#eef2f5;margin:0;padding:40px 20px}main{max-width:700px;margin:auto}h1{font-size:44px;margin-bottom:10px}.tag{color:#ff7979}section{background:#20303e;border:1px solid #425665;border-radius:12px;padding:24px;margin:24px 0}input,button{font:inherit;padding:12px;border-radius:6px;border:0}input{max-width:90%;margin-bottom:10px}button{background:#ee3030;color:white;cursor:pointer}dt{color:#b8c8d5;margin-top:16px}dd{margin:4px 0;overflow-wrap:anywhere}a{color:#ff9d9d}</style></head>
<body><main><p class="tag">RED HAT SUMMIT 2026 · WORKSHOP DEMO</p><h1>Hello from my VM</h1><p>A small Java + Spring Boot app for OpenShift Virtualization.</p>
<section><form id="greeting"><label for="name">Your name</label><br><input id="name" maxlength="80" placeholder="Rohan"><button>Say hello</button></form><p id="message" aria-live="polite">Enter your name to try the API.</p></section>
<section><h2>Application details</h2><dl id="details"></dl><button id="refresh">Refresh details</button><p id="status" aria-live="polite"></p></section><p><a href="/actuator/health">Health endpoint</a> · <a href="/api/info">VM information API</a></p></main>
<script>
async function json(url){const r=await fetch(url);if(!r.ok)throw new Error('Request failed: '+r.status);return r.json()}
document.getElementById('greeting').addEventListener('submit',async e=>{e.preventDefault();const el=document.getElementById('message');try{el.textContent=(await json('/api/hello?name='+encodeURIComponent(document.getElementById('name').value))).message}catch(err){el.textContent=err.message}});
async function refresh(){try{const info=await json('/api/info');const dl=document.getElementById('details');dl.replaceChildren();for(const [key,value] of Object.entries(info)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;dl.append(dt,dd)}document.getElementById('status').textContent='Details updated.'}catch(err){document.getElementById('status').textContent=err.message}}
document.getElementById('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
